<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録</title>
    <!--cssはloginと共通-->
    <link rel="stylesheet" href="/site/css/login.css">
    <script src="/site/js/signup.js"></script>
</head>
<body>
    <div id="error-message" style="color: red;"></div>
    <div class="signup-container">
        <h1>新規登録</h1>
        <form id="signupForm" action="/site/Signup" method="post">
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" placeholder="メールアドレスを入力" required>
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" placeholder="パスワードを入力" required>
            </div>
            <button type="submit" class="signup-button">登録する</button>
        </form>
        <!-- ログインページへのリンク -->
        <p class="login-link">
            すでにアカウントをお持ちの方：<a href="login.html">ログイン</a>
        </p>
    </div>
</body>
</html>
