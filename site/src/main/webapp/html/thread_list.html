<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>thread_list</title>
	<link rel="stylesheet" href="../css/thread_list.css" type="text/css">
</head>

<body>
	<header id="header"></header>
	<div class="container">
		<!-- 並べ替えボタン -->
		<div class="sort-dropdown">
			<select id="sort-select" onchange="selectSort()">
				<option value="new" selected>新着順</option>
				<option value="activity">勢い順</option>
				<option value="popularity">人気順</option>
			</select>
		</div>

		<!-- スレッド作成ボタン -->
		<a href="./thread_make.html"><button class="create-thread-button">スレッド作成</button></a>

		<label><input type="radio" name="select-search" id="select-tag" checked>タグ検索 </label>
		<label><input type="radio" name="select-search" id="select-title">タイトル検索</label>

		<input type="text" id="search-box">
		<!-- スレッド一覧 -->
		<div id = "search_button">検索</div>
		<div class="thread-list" id="thread-list">
			<!-- 追加のスレッド項目も同様に設定 -->
		</div>
		<div class="nav-container">
			<button class="nav-btn prev-btn">
				<svg class="arrow-icon" viewBox="0 0 24 24">
					<path d="M15.5 19l-7-7 7-7" stroke="currentColor" stroke-width="2" fill="none" />
				</svg>
			</button>
			<button class="nav-btn next-btn">
				<svg class="arrow-icon" viewBox="0 0 24 24">
					<path d="M8.5 19l7-7-7-7" stroke="currentColor" stroke-width="2" fill="none" />
				</svg>
			</button>
		</div>
		<div id="page" ><div id=page-num>1</div>ページ</div>
	</div>
	<script src="../js/thread_list.js"></script>
	<script src="../parts/header.js"></script>
</body>

</html>
