<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./../css/login.css">
    <title>スーパーチャット</title>
</head>

<body>
    <form action="/site/Login" method="post">
        <div class="login_form_top">
            <h1>ログイン</h1>
        </div>
        <div class="login_form_btm">
            <label for="user_id">メールアドレス</label><br>
            <input type="email" name="user_id" id="user_id" placeholder="メールアドレスを入力してください" required><br>
            <label for="password">パスワード</label><br>
            <input type="password" name="password" id="password" placeholder="パスワードを入力してください" required><br>
        </div><br>
        <input type="submit" value="ログイン">
    </form>
</body>

</html>
